---
- name: Inspect existing mounts on the selected drive
  ansible.builtin.command:
    argv: [lsblk, -nr, -o, MOUNTPOINTS, "{{ item.device }}"]
  register: selected_drive_mounts
  changed_when: false

- name: Refuse to partition the OS drive
  ansible.builtin.assert:
    that:
      - "'/' not in (selected_drive_mounts.stdout_lines | map('trim') | list)"
      - "'/boot' not in (selected_drive_mounts.stdout_lines | map('trim') | list)"
      - "'/boot/firmware' not in (selected_drive_mounts.stdout_lines | map('trim') | list)"
    fail_msg: "{{ item.device }} contains the mounted OS or boot filesystem. Select a different drive in storage_vars.yml."

- name: Read the selected drive capacity when an expected size is configured
  ansible.builtin.command:
    argv: [lsblk, -bnd, -o, SIZE, "{{ item.device }}"]
  register: selected_drive_size
  changed_when: false
  when: item.expected_size_gb is defined

- name: Require the selected drive to have the expected capacity
  ansible.builtin.assert:
    that:
      - (selected_drive_size.stdout | trim | int) >= ((item.expected_size_gb | int) * 850000000)
      - (selected_drive_size.stdout | trim | int) <= ((item.expected_size_gb | int) * 1150000000)
    fail_msg: "{{ item.device }} is not approximately {{ item.expected_size_gb }} GB. Verify drive enumeration before partitioning."
  when: item.expected_size_gb is defined

- name: Partition the USB drive
  community.general.parted:
    device: "{{ item.device }}"
    number: 1
    state: present
    fs_type: ext4
    label: gpt

- name: Create an ext4 filesystem on the partition
  community.general.filesystem:
    fstype: ext4
    dev: "{{ item.partition }}"

- name: Get the UUID of the new partition
  ansible.builtin.command: "blkid -s UUID -o value {{ item.partition }}"
  register: blkid_result
  changed_when: false

- name: Store the partition UUID as a fact
  ansible.builtin.set_fact:
    partition_uuid: "{{ blkid_result.stdout }}"

- name: Create the mount point directory
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: '0755'

- name: Mount the drive by UUID and add it to fstab
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "UUID={{ partition_uuid }}"
    fstype: ext4
    opts: defaults,nofail
    state: mounted

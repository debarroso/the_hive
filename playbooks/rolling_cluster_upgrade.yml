---
- name: Upgrade K3s nodes one at a time
  hosts: the_hive
  become: true
  serial: 1
  order: reverse_inventory  # Upgrade the workers before the single control-plane node.
  vars_files:
    - storage_vars.yml

  tasks:
    - name: Cordon and drain the node
      block:
        - name: Cordon the node
          become: false
          ansible.builtin.command:
            argv: [kubectl, cordon, "{{ inventory_hostname }}"]
          delegate_to: localhost

        - name: Drain the node while respecting PodDisruptionBudgets
          become: false
          ansible.builtin.command:
            argv:
              - kubectl
              - drain
              - "{{ inventory_hostname }}"
              - --ignore-daemonsets
              - --delete-emptydir-data
              - --timeout=300s
          delegate_to: localhost

      rescue:
        - name: Uncordon the node if draining failed before the upgrade
          become: false
          ansible.builtin.command:
            argv: [kubectl, uncordon, "{{ inventory_hostname }}"]
          delegate_to: localhost

        - name: Stop the upgrade after a failed drain
          ansible.builtin.fail:
            msg: "Could not drain {{ inventory_hostname }}; it was uncordoned and no packages were changed."

    - name: Update apt cache and upgrade packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist

    - name: Reboot the node
      ansible.builtin.reboot:
        msg: "Rebooting node {{ inventory_hostname }} after updates"

    - name: Check that the local volume directory is still on its external drive
      ansible.builtin.command:
        argv:
          - findmnt
          - --noheadings
          - --output
          - TARGET
          - --target
          - "{{ local_storage_path }}"
      register: local_storage_mount
      changed_when: false

    - name: Require the volume drive to be mounted before accepting the node
      ansible.builtin.assert:
        that:
          - local_storage_mount.stdout | trim == disks_to_mount[0].path
        fail_msg: "{{ local_storage_path }} is not on {{ disks_to_mount[0].path }}. The node remains cordoned."

    - name: Check the optional K3s runtime drive after reboot
      ansible.builtin.command:
        argv: [findmnt, --noheadings, --output, TARGET, --target, "{{ k3s_data_dir }}"]
      register: runtime_mount
      changed_when: false
      when: k3s_data_mount | length > 0

    - name: Require the optional K3s runtime drive before accepting the node
      ansible.builtin.assert:
        that:
          - runtime_mount.stdout | trim == k3s_data_mount
        fail_msg: "{{ k3s_data_dir }} is not on {{ k3s_data_mount }}. The node remains cordoned."
      when: k3s_data_mount | length > 0

    - name: Wait for the node to report Ready
      become: false
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - --for=condition=Ready
          - "node/{{ inventory_hostname }}"
          - --timeout=30s
      delegate_to: localhost
      register: node_ready
      until: node_ready.rc == 0
      retries: 20
      delay: 10
      changed_when: false

    # A local-path volume is tied to this node. Its pod cannot become Ready
    # until scheduling is enabled again, so uncordon before waiting for apps.
    - name: Uncordon the recovered node
      become: false
      ansible.builtin.command:
        argv: [kubectl, uncordon, "{{ inventory_hostname }}"]
      delegate_to: localhost

    - name: List all deployments and stateful sets
      become: false
      ansible.builtin.command:
        argv: [kubectl, get, deployments,statefulsets, --all-namespaces, -o, json]
      delegate_to: localhost
      register: workload_json
      changed_when: false

    - name: Wait for workloads to recover before upgrading the next node
      become: false
      ansible.builtin.command:
        argv:
          - kubectl
          - rollout
          - status
          - "{{ item.kind | lower }}/{{ item.metadata.name }}"
          - -n
          - "{{ item.metadata.namespace }}"
          - --timeout=300s
      delegate_to: localhost
      loop: "{{ (workload_json.stdout | from_json).items }}"
      loop_control:
        label: "{{ item.metadata.namespace }}/{{ item.kind | lower }}/{{ item.metadata.name }}"
      changed_when: false

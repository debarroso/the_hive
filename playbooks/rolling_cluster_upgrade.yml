# playbook-k8s-safe-rolling-upgrade.yml
---
- name: Perform a SAFE rolling update on Kubernetes nodes
  hosts: the_hive
  become: true
  serial: 1          # Forces a one-by-one update.

  tasks:
    - name: Cordon the node to prevent new pods from being scheduled
      become: false
      ansible.builtin.command: "kubectl cordon {{ inventory_hostname }}"
      delegate_to: localhost # Assumes kubectl is configured on the machine running Ansible

    - name: Drain the node of all running pods
      become: false
      ansible.builtin.command: >
        kubectl drain {{ inventory_hostname }}
        --ignore-daemonsets
        --delete-emptydir-data
        --force
        --timeout=300s
        --skip-wait-for-delete-timeout=60
        --disable-eviction
      delegate_to: localhost

    - name: Update apt cache and upgrade packages
      ansible.builtin.apt:
        update_cache: yes
        upgrade: dist

    - name: Reboot the node
      ansible.builtin.reboot:
        msg: "Rebooting node {{ inventory_hostname }} after updates"

    - name: Wait for the node to report as 'Ready' in Kubernetes
      become: false
      ansible.builtin.shell: "kubectl get node {{ inventory_hostname }} -o jsonpath='{.status.conditions[?(@.type==\"Ready\")].status}'"
      delegate_to: localhost
      register: node_status
      until: node_status.stdout == 'True'
      retries: 30  # Try 30 times
      delay: 10    # Wait 10 seconds between each try (5 minutes total)
      changed_when: false # This command doesn't change state, so we report no change

    - name: Check if Prefect Server deployment exists
      become: false
      ansible.builtin.command: "kubectl get deployment prefect-server -n prefect"
      delegate_to: localhost
      register: prefect_server_check
      failed_when: false
      changed_when: false

    - name: Wait for Prefect Server to be fully stable
      become: false
      ansible.builtin.command: "kubectl rollout status deployment/prefect-server -n prefect --timeout=300s"
      delegate_to: localhost
      changed_when: false
      when: prefect_server_check.rc == 0

    - name: Check if Prefect Worker deployment exists
      become: false
      ansible.builtin.command: "kubectl get deployment prefect-worker -n prefect"
      delegate_to: localhost
      register: prefect_worker_check
      failed_when: false
      changed_when: false

    - name: Wait for Prefect Worker to be fully stable
      become: false
      ansible.builtin.command: "kubectl rollout status deployment/prefect-worker -n prefect --timeout=300s"
      delegate_to: localhost
      changed_when: false
      when: prefect_worker_check.rc == 0

    - name: Uncordon the node to bring it back into service
      become: false
      ansible.builtin.command: "kubectl uncordon {{ inventory_hostname }}"
      delegate_to: localhost
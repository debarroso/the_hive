---
- name: Enable Cgroups and Remove Duplicates
  hosts: the_hive
  become: true

  tasks:
    - name: Check modern Raspberry Pi boot path
      ansible.builtin.stat:
        path: /boot/firmware/cmdline.txt
      register: firmware_cmdline

    - name: Select the boot command line file
      ansible.builtin.set_fact:
        boot_cmdline_path: "{{ '/boot/firmware/cmdline.txt' if firmware_cmdline.stat.exists else '/boot/cmdline.txt' }}"

    - name: Remove extra memory cgroup arguments
      ansible.builtin.replace:
        path: "{{ boot_cmdline_path }}"
        regexp: 'cgroup_memory=1(?=.*cgroup_memory=1)'
        replace: ''
      register: cgroup_memory_duplicates

    - name: Remove extra cgroup controller arguments
      ansible.builtin.replace:
        path: "{{ boot_cmdline_path }}"
        regexp: 'cgroup_enable=memory(?=.*cgroup_enable=memory)'
        replace: ''
      register: cgroup_enable_duplicates

    - name: Ensure the memory cgroup parameter is present
      ansible.builtin.lineinfile:
        path: "{{ boot_cmdline_path }}"
        regexp: '^(?!.*(?:^|\s)cgroup_memory=1(?:\s|$))(.*)$'
        line: '\1 cgroup_memory=1'
        backrefs: yes
      register: cgroup_memory_change

    - name: Ensure the cgroup memory controller is enabled
      ansible.builtin.lineinfile:
        path: "{{ boot_cmdline_path }}"
        regexp: '^(?!.*(?:^|\s)cgroup_enable=memory(?:\s|$))(.*)$'
        line: '\1 cgroup_enable=memory'
        backrefs: yes
      register: cgroup_enable_change

    - name: Reboot the nodes to apply boot changes
      ansible.builtin.reboot:
        msg: "Rebooting nodes to enable cgroups"
      when: cgroup_memory_duplicates.changed or cgroup_enable_duplicates.changed or cgroup_memory_change.changed or cgroup_enable_change.changed

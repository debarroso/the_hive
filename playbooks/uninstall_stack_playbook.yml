---
- name: Uninstall application stack
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Remove application Helm releases
      kubernetes.core.helm:
        name: "{{ item.name }}"
        release_namespace: "{{ item.namespace }}"
        state: absent
        wait: true
        timeout: 10m0s
      loop:
        - { name: prometheus, namespace: monitoring }
        - { name: prefect-worker, namespace: prefect }
        - { name: prefect-server, namespace: prefect }
        - { name: n8n, namespace: n8n }

    - name: Remove application namespaces and their persistent volume claims
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Namespace
        name: "{{ item }}"
        wait: true
        wait_timeout: 300
      loop:
        - prefect
        - monitoring
        - n8n
        - pihole
